org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation memory-maps its cache files and cannot release
# them on Windows, failing plugin modules with "Could not close incremental
# caches". Release builds are clean builds anyway, so IC buys nothing here.
kotlin.incremental=false
# android.newDsl / android.builtInKotlin are AGP 9 flags and are deliberately
# absent: this project is pinned to AGP 8 (see settings.gradle.kts).
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
